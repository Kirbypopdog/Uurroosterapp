services:
  - type: web
    name: uurrooster-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_RESET_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    healthCheckPath: /health

  - type: web
    name: uurrooster-mcp
    runtime: node
    rootDir: mcp-server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: API_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MCP_API_KEY
        sync: false
    healthCheckPath: /health

  - type: static
    name: uurrooster-frontend
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
