name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify frontend files exist
        run: |
          node -e "
            const fs = require('fs');
            const files = [
              'frontend/index.html',
              'frontend/app-globals.js',
              'frontend/app-nav.js',
              'frontend/app-planner.js',
              'frontend/app-shifts.js',
              'frontend/app-employees.js',
              'frontend/app-builder.js',
              'frontend/app-settings.js',
              'frontend/app-auth.js',
              'frontend/app-init.js',
              'frontend/data.js',
              'frontend/validation.js',
              'frontend/drag-handler.js',
              'frontend/styles.css',
              'frontend/config/settings.js'
            ];
            files.forEach(f => { fs.accessSync(f); });
            console.log('Frontend files OK');
          "

      - name: Check frontend JS syntax
        run: |
          for f in frontend/app-*.js frontend/data.js frontend/validation.js frontend/drag-handler.js frontend/config/settings.js; do
            node --check "$f"
          done
          echo "Frontend JS syntax OK"

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Run backend tests
        run: cd backend && npm test

      - name: Check backend JS syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/db.js
          echo "Backend JS syntax OK"

      - name: Verify schema.sql exists
        run: test -f backend/sql/schema.sql && echo "Schema OK"

      # #381: de kwetsbaarheden groeiden stilletjes mee omdat niemand de
      # auditmelding in de Render-build las. Nu de lijst leeg is, bewaakt CI
      # dat hij leeg blijft.
      #
      # Bewust hier en niet in de Render-build: een audit die de build breekt,
      # blokkeert ook een spoedfix. Op een pull request is het een signaal, en
      # dan is er tijd om te kiezen.
      #
      # Drempel op high. Moderate en low komen vaak uit bouwgereedschap en
      # zouden de controle tot ruis maken, waarna niemand hem nog leest.
      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high

      - name: Audit mcp-server dependencies
        run: cd mcp-server && npm install --package-lock-only && npm audit --audit-level=high
